<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Doctor Registration - MedConnect"/>
  <title>Doctor Registration - MedConnect</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">

  <div class="auth-layout">
    <aside class="auth-visual"><span class="auth-mark" aria-hidden="true">&#9877;</span><p class="eyebrow">Join the care team</p><h1>Give your patients a clearer care journey.</h1><img src="https://images.unsplash.com/photo-1576091160550-2173dba999ef?auto=format&fit=crop&w=900&q=85" alt="Healthcare professional discussing care with a patient"></aside>
    <div class="login-container">
    <h2>🩺 Doctor Registration</h2>
    <form action="doctor/register_doctor.php" method="POST">
      <input type="text" name="fullname" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="tel" name="phone" placeholder="Phone Number" required />
      <select name="department" required>
        <option value="" selected disabled>Choose Department</option>
        <option value="Cardiology">Cardiology</option>
        <option value="Dermatology">Dermatology</option>
        <option value="General Medicine">General Medicine</option>
        <option value="Gynecology">Gynecology</option>
        <option value="Neurology">Neurology</option>
        <option value="Ophthalmology">Ophthalmology</option>
        <option value="Orthopedics">Orthopedics</option>
        <option value="Pediatrics">Pediatrics</option>
        <option value="Psychiatry">Psychiatry</option>
        <option value="Pulmonology">Pulmonology</option>
        <option value="Dentistry">Dentistry</option>
        <option value="ENT">ENT</option>
      </select>
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit" class="btn login-btn">Register</button>
      <p class="switch-link">Already have an account? <a href="doctor-login.html">Login here</a></p>
    </form>
    </div>
  </div>

  <script src="js/design-switch.js"></script>
</body>
</html>
