<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Patient Login - MedConnect"/>
  <title>Patient Login - MedConnect</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">

  <div class="auth-layout">
    <aside class="auth-visual"><span class="auth-mark" aria-hidden="true">&#9825;</span><p class="eyebrow">Personal care, in view</p><h1>Stay connected to the details that help you feel well.</h1><img src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=900&q=85" alt="Doctor reviewing health information"></aside>
    <div class="login-container">
    <h2>👤 Patient Login</h2>
    <div id="login-status" class="login-status" role="alert" hidden></div>
    <form action="patient/login_patient.php" method="POST">
      <input type="text" placeholder="Username" name="username" required autocomplete="username" />
      <span class="password-field"><input id="patient-password" type="password" placeholder="Password" name="password" required autocomplete="current-password" /><button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" data-password-target="patient-password">&#128065;</button></span>
      <button type="submit" class="btn login-btn">Login</button>
      <p class="switch-link"><a href="forgot-password.php?role=patient">Forgot password?</a></p>
      <p class="switch-link">Not registered? <a href="patient-register.html">Register here</a></p>
    </form>
    </div>
  </div>

  <script>
    const loginStatus = document.getElementById('login-status');
    const query = new URLSearchParams(window.location.search);
    const statusMessages = {
      invalid_credentials: ['Login failed', 'The username or password is incorrect.'],
      user_not_found: ['Account not found', 'No patient account was found with that username.'],
      database_error: ['Login unavailable', 'We could not verify your account right now. Please try again.']
    };
    const statusKey = query.get('error');

    if (query.get('reset') === 'success') {
      loginStatus.innerHTML = '<strong>Password updated</strong><br>Your password has been reset successfully. You can now sign in with your new password.';
      loginStatus.classList.add('login-status-success');
      loginStatus.hidden = false;
    } else if (statusMessages[statusKey]) {
      loginStatus.innerHTML = `<strong>${statusMessages[statusKey][0]}</strong><br>${statusMessages[statusKey][1]}`;
      loginStatus.classList.add('login-status-error');
      loginStatus.hidden = false;
    }

    document.querySelector('.password-toggle').addEventListener('click', function () {
      const password = document.getElementById(this.dataset.passwordTarget);
      const isVisible = password.type === 'text';
      password.type = isVisible ? 'password' : 'text';
      this.setAttribute('aria-pressed', String(!isVisible));
      this.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
    });
  </script>
  <script src="js/design-switch.js"></script>
</body>
</html>
